<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#EDF0EA;--panel:#FBFBF8;--ink:#18232E;--muted:#5B6672;--line:#D3D9D0;--soft:#E3E8E0;
--route:#C2412D;--lake:#2F6FA8;--hut:#3F7D5C;--grass:#A88E3C;--grid:#DCE1D8;--fill:rgba(47,111,168,.12);
--tp:#3550A0;--tp-bg:#E5EAF7;--hc:#B4651A;--hc-bg:#F8ECDD;--jm:#6A4C93;--jm-bg:#EEE7F6;--tr:#2E7A5B;--tr-bg:#E2F1EA;
--sky1:#DDE6EE;--hero:#F1F3EE;--contour:#B9C1B7;--contour2:#9EA89C;--rt:#A9806F;--rtj:#8A7AA6;--ridge:#9FB2C2;--ridge2:#6F8799}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11171D;--panel:#19222B;--ink:#E6EAE4;--muted:#9AA6B0;--line:#2E3A45;--soft:#222D37;--route:#E8705B;--lake:#6FA8DC;--hut:#6DB58E;--grass:#CDB46A;--grid:#25303A;--fill:rgba(111,168,220,.16);
--tp:#93A9EC;--tp-bg:#232D4A;--hc:#E8A65E;--hc-bg:#3A2A18;--jm:#C3A6EA;--jm-bg:#2E2440;--tr:#7FCBA6;--tr-bg:#1C3329;--sky1:#17212B;--hero:#151C22;--contour:#2F3B44;--contour2:#3E4E5B;--rt:#9A7466;--rtj:#A596C4;--ridge:#2B3A48;--ridge2:#3A4E60}}
:root[data-theme="dark"]{--paper:#11171D;--panel:#19222B;--ink:#E6EAE4;--muted:#9AA6B0;--line:#2E3A45;--soft:#222D37;--route:#E8705B;--lake:#6FA8DC;--hut:#6DB58E;--grass:#CDB46A;--grid:#25303A;--fill:rgba(111,168,220,.16);--tp:#93A9EC;--tp-bg:#232D4A;--hc:#E8A65E;--hc-bg:#3A2A18;--jm:#C3A6EA;--jm-bg:#2E2440;--tr:#7FCBA6;--tr-bg:#1C3329;--sky1:#17212B;--hero:#151C22;--contour:#2F3B44;--contour2:#3E4E5B;--rt:#9A7466;--rtj:#A596C4;--ridge:#2B3A48;--ridge2:#3A4E60}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.65}
a{color:var(--lake)}
.serif{font-family:"Noto Serif TC","Songti TC",serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--ink)}
.hero .topo{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (max-width:600px){.hero .rtg{display:none}}
.hero .wrap{position:relative;z-index:1;padding-top:64px;padding-bottom:80px}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(40px,7vw,76px);line-height:1;margin:0;letter-spacing:.04em}
.hero .dates{font-family:"Noto Serif TC",serif;font-size:clamp(18px,2.4vw,24px);margin:14px 0 0;font-variant-numeric:tabular-nums}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tag.tp{background:var(--tp-bg);color:var(--tp)}.tag.hc{background:var(--hc-bg);color:var(--hc)}
.tag.jm{background:var(--jm-bg);color:var(--jm)}.tag.tr{background:var(--tr-bg);color:var(--tr)}
.tag.tp::before,.tag.hc::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}

.nav{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:14px 12px 12px;white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover,.nav a:focus-visible{color:var(--ink);border-bottom-color:var(--route);outline:none}

main.wrap{padding-top:28px;padding-bottom:56px}
main>section{margin-bottom:52px}
.leaflet-control-layers section{margin:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;margin:0 0 16px}
.sh h2{font-family:"Noto Serif TC",serif;font-weight:700;font-size:28px;margin:0}
.sh p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
h3{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;margin:0}

.me{padding:20px 22px}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pick label{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700}
.pick select{font:inherit;font-size:16px;padding:8px 12px;min-width:220px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.pick .hint{color:var(--muted);font-size:14px}
.mine{margin-top:18px;display:none}
.mine.on{display:block}
.idrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.idrow b{font-family:"Noto Serif TC",serif;font-size:30px;line-height:1.1}
.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
@media (max-width:900px){.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.blocks{grid-template-columns:minmax(0,1fr)}}
.blk{padding:14px 16px 4px 0;margin-right:16px}
.blk+.blk{border-left:1px solid var(--line);padding-left:16px;margin-right:0}
@media (max-width:900px){.blk:nth-child(3){border-left:0;padding-left:0}.blk:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:520px){.blk+.blk{border-left:0;padding-left:0;border-top:1px solid var(--line)}}
.blk h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.blk .big{font-size:18px;font-weight:700;line-height:1.35}
.blk .ln{margin:4px 0 0;font-size:14px}
.blk .ln .tm{font-weight:700;font-variant-numeric:tabular-nums;margin-right:6px}

.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.days{grid-template-columns:minmax(0,1fr)}}
.dayc{padding:16px 16px 12px}
.dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.dh b{white-space:nowrap;font-family:"Noto Serif TC",serif;font-size:22px;font-weight:900}
.dh span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.shl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:4px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:500}
.stat-ln{font-size:12px;color:var(--muted);margin:-4px 0 8px;font-variant-numeric:tabular-nums}
.tl .sub.n{margin-top:0}.tl .sub.n .t{font-size:12px;color:var(--muted)}
.dh em{font-style:normal;font-size:13px;color:var(--muted);display:block;text-align:right}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--soft)}
.tl li:first-child{border-top:0}
.tl time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.tl li.warn{background:color-mix(in srgb,var(--route) 8%,transparent);margin:0 -8px;padding:7px 8px;border-radius:6px;border-top-color:transparent}
.tl .tag{margin:0 0 3px;display:inline-flex}
.tl .t{display:block}
.tl .sub+.sub{margin-top:6px}
.tl time small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tl .none{color:var(--muted);padding:6px 0}

.cars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.cars{grid-template-columns:minmax(0,1fr)}}
.car{overflow:hidden}
.car .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.car .ch h3{display:flex;align-items:center;gap:10px}
.car .ch h3::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.car.tp{--c:var(--tp)}.car.hc{--c:var(--hc)}
.car .plate{color:var(--c)}
.car .ch .right{display:flex;align-items:center;gap:8px}
.car .ch h3{font-size:20px}
.plate{font-weight:700;letter-spacing:.06em;font-size:12px;line-height:1.5;border:1.5px solid currentColor;border-radius:3px;padding:0 6px;font-variant-numeric:tabular-nums}
.car .cb{padding:4px 18px 12px}
.drv{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.drv b{color:var(--ink);font-size:15px}
.tel{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--paper)}
.tel::before{content:"☎";font-size:13px}
.stop{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--soft)}
.stop:last-child{border-bottom:0}
.stop .when{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.stop .where{font-weight:500}
.stop .where a{font-size:13px;margin-left:8px;font-weight:400}
.addr{display:block;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin-top:8px}
.chip{font-size:14px;padding:2px 11px;border-radius:999px;background:var(--soft);border:1px solid transparent;transition:background .15s}
.chip.hl{background:var(--route);color:#fff}
.hlbox .hlbox{border-color:var(--ink)}
.retlbl{font-size:14px;color:var(--muted);margin:22px 0 10px;font-weight:500}

.inn{padding:18px 20px;margin-bottom:14px}
.inn h3 a{font-family:"Noto Sans TC",sans-serif;font-size:14px;font-weight:400;margin-left:10px}
.inn h3{font-size:24px}
.inn p{margin:2px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-block;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:7px 16px;border-radius:6px;font-size:14px;font-weight:500}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.rooms{grid-template-columns:minmax(0,1fr)}}
.room{padding:14px 16px;align-content:start;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px}
.room .code{grid-row:span 3;width:44px;height:44px;border-radius:8px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700}
.room .code.n{font-size:14px}
.room .rt b{font-size:16px}
.room p{margin:0;font-size:13px;color:var(--muted)}
.room .chips{margin-top:4px}

.teams{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media (max-width:760px){.teams{grid-template-columns:minmax(0,1fr)}}
.team{padding:16px 18px}
.team .th{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.team .th span{color:var(--muted)}
.tents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:520px){.tents{grid-template-columns:minmax(0,1fr)}}
.tents.one{grid-template-columns:minmax(0,1fr)}
.tent{padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.tent.hlbox{border-style:solid}
.tent b{font-size:14px}

.rlg{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px;color:var(--muted)}
.rlg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.rh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px;margin-bottom:16px}
.rh h2.sec{font-family:"Noto Serif TC",serif;font-weight:700;font-size:28px;margin:0}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.dgbtn{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dgbtn::before{content:"";width:12px;height:12px;border:1.5px solid currentColor;border-radius:3px;box-shadow:inset 0 -4px 0 -2px currentColor}
.dgbtn:hover{border-color:var(--ink)}
.dgdlg{border:0;padding:0;border-radius:14px;background:var(--panel);color:var(--ink);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dgdlg::backdrop{background:rgba(17,23,29,.55)}
.dgh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dgs[data-g="jm"] .dg-nm.sm{font-size:16.5px}.dgs[data-g="jm"] .dg-t{font-size:16px}.dgs[data-g="jm"] svg{min-width:1000px}
.dghl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.dgnote{font-size:13px;color:var(--muted)}
.dgdlg [data-g][hidden]{display:none}
.dgh h2{font-family:"Noto Serif TC",serif;font-weight:700;font-size:20px;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.dgh h2 span{font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:400;color:var(--muted)}
.dgh .x{font:inherit;font-size:18px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;flex:none}
@media (max-width:600px){.dgdlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}.dgdlg[open]{display:flex;flex-direction:column}.dgdlg .dgs{flex:1;overflow:auto}}
.dgs{padding:16px 20px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dgs svg{display:block;width:100%;min-width:760px;height:auto}
.dg-nm{font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle}
.dg-nm.sm{font-size:13.5px}
.dg-p .dg-nm{fill:var(--route)}.dg-l .dg-nm{fill:var(--lake)}.dg-h .dg-nm{fill:var(--hut)}
.dg-el{font-size:12px;fill:var(--muted);text-anchor:middle}
.dg-ar{stroke:var(--muted);stroke-width:1.6;stroke-linecap:round}
.dg-t{font-size:13px;font-weight:500;fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;overflow:hidden;height:min(72vh,640px);min-height:380px}
#map{width:100%;height:100%}
.leaflet-container{font-family:inherit;background:var(--paper)}
.wplab{background:none;border:0;box-shadow:none;font-size:12px;font-weight:700;color:#1F2A36;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;padding:0}
.wplab.big{font-size:14px;font-weight:700;font-family:"Noto Serif TC",serif}
.wplab::before{display:none}
.side{display:flex;flex-direction:column;max-height:min(72vh,640px)}
.side h2,.prof h2{font-family:"Noto Serif TC",serif;font-weight:700;font-size:18px;margin:0;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.list{overflow:auto;padding:6px 0;margin:0}
.wp{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit}
.wp:hover,.wp.on{background:var(--fill)}
.wp .dot{width:10px;height:10px;border-radius:50%;justify-self:center}
.wp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .km{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.wp .el{display:block;font-size:12px;color:var(--muted)}
.list .day{font-size:13px;color:var(--muted);padding:12px 16px 4px;font-weight:500}
.prof{margin-top:14px}
.profin{padding:12px 16px 16px}
#pf{width:100%;height:220px;display:block}
.scrub{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.scrub input{flex:1;min-width:200px;accent-color:var(--route)}
.readout{font-variant-numeric:tabular-nums;min-width:260px;flex:1 1 100%;font-size:14px}
.readout b{font-weight:700}
.note{color:var(--muted);font-size:13px;margin:12px 0 0}
select:focus-visible,.wp:focus-visible,input[type=range]:focus-visible,.btn:focus-visible,.tel:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
@media (max-width:600px){

.wrap{padding:0 14px}
.hero .wrap{padding-top:36px;padding-bottom:70px}
.hero h1{font-size:38px}
.hero .dates{margin-top:8px;font-size:16px}
.hero .meta{margin-top:10px}
main.wrap{padding-top:18px}
main>section{margin-bottom:40px}
.sh h2,.rh h2.sec{font-size:24px}
.me{padding:16px}
.pick select{flex:1;min-width:0}
.pick .hint{flex-basis:100%}
.idrow b{font-size:26px}
.blk{margin-right:0;padding-right:0}
.car .ch,.car .cb{padding-left:14px;padding-right:14px}
.stop{grid-template-columns:54px minmax(0,1fr)}
.drv{gap:6px 12px}
.stats{gap:16px}
.stat b{font-size:18px}
.mapbox{height:62vh;min-height:340px}
.side{max-height:420px}
.leaflet-control-layers-expanded{font-size:13px}
}
.navbtn{font:inherit;font-size:13px;font-weight:700;color:var(--panel);background:var(--ink);border:0;border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.navbtn::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1500;padding:12px 18px;font-size:15px;box-shadow:0 6px 20px rgba(17,23,29,.28)}

#nav{position:fixed;inset:0;z-index:5000;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav.on{display:flex}
.nv-top{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.nv-top .x{font:inherit;font-size:15px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;flex:none}
.nv-top .seg{padding:2px}
.nv-top .seg button{padding:3px 10px;font-size:13px}
.nv-next{padding:10px 14px 9px;background:var(--panel);border-bottom:1px solid var(--line)}
.nv-next .lb{font-size:12px;color:var(--muted)}
.nv-next .nm{font-size:20px;font-weight:700;line-height:1.3}
.nv-next .row{font-size:15px;margin-top:1px;font-variant-numeric:tabular-nums;color:var(--ink)}
.nv-next .row b{font-size:17px}
.nv-next .row{display:flex;flex-wrap:wrap;column-gap:14px}.nv-next .row .g{white-space:nowrap}
.nv-body{flex:1;display:flex;min-height:0}

.nv-panel{width:340px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}

.nv-li .pt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.nv-li .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nv-foot button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;margin-right:8px}
.nv-w{margin-top:4px;font-size:13px;color:#A0331F}
.nv-i{font:italic 700 13px Georgia,serif!important;width:26px;height:26px;padding:0!important;border-radius:50%!important;vertical-align:middle}
.nv-tip{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.6}
.nv-tip ol{margin:6px 0;padding-left:18px}.nv-tip li{margin:4px 0}.nv-tip span{color:var(--muted);font-size:12px}.nv-tip p{margin:6px 0 0;color:var(--muted);font-size:12px}
.nv-loc{background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.25);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border:0;padding:0}
.nv-loc svg{width:18px;height:18px}

async function downloadTiles(){if(window.__dl)return;window.__dl=1;const list=tiles();const c=await caches.open("jml-tiles");let done=0,fail=0;
setMsg(`離線地圖下載中 0/${list.length}`);
const q=list.slice();async function worker(){while(q.length){const u=q.shift();try{if(!(await c.match(u))){let r;try{r=await fetch(u,{mode:"cors"})}catch(e){r=await fetch(u,{mode:"no-cors"})}if(r&&(r.ok||r.type==="opaque"))await c.put(u,r);else fail++}}catch(e){fail++}done++;if(done%10===0||done===list.length)setMsg(`離線地圖下載中 ${done}/${list.length}`)}}
await Promise.all(Array.from({length:6},worker));window.__dl=0;
let est="";try{const e=await navigator.storage.estimate();est=`，使用約 ${Math.round(e.usage/1048576)} MB`}catch(e){}
setMsg(fail?`下載完成，${fail} 張失敗，可再按一次補抓${est}`:`離線地圖已下載（${list.length} 張${est}）`);try{localStorage.setItem("jml-tiles-ok",String(!fail))}catch(e){}}
// ---------- switching
function defaultSel(){try{const v=localStorage.getItem(skey());if(v!=null)return +v}catch(e){}
if(today()!==DATE[st.day])return 0;const n=nowMin(),P=rows();let s=0;P.forEach((p,k)=>{if((k===0?p.dep:p.arr)<=n)s=k});return s}
function setSel(rid,day){st.rid=rid;st.day=day;st.sel=defaultSel();
document.querySelectorAll("#nvroute button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===rid));
document.querySelectorAll("#nvday button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===day));
drawRoute();render(true)}
document.querySelectorAll("#nvroute button").forEach(b=>b.onclick=()=>setSel(b.dataset.v,st.day));
document.querySelectorAll("#nvday button").forEach(b=>b.onclick=()=>setSel(st.rid,+b.dataset.v));
function open(){const w=document.getElementById("who").value;const g=GROUPS.find(x=>x.people.includes(w));
const rid=g?g.id:"tr";const t=today();const day=t===DATE[2]?2:t===DATE[3]?3:1;
document.getElementById("nav").classList.add("on");document.body.style.overflow="hidden";initMap();setTimeout(()=>{map.invalidateSize();setSel(rid,day)},30);
if(location.hash!=="#progress")history.replaceState(null,"","#progress")}
function close(){document.getElementById("nav").classList.remove("on");document.body.style.overflow="";if(location.hash==="#progress")history.replaceState(null,"",location.pathname+location.search)}
document.querySelectorAll("[data-open-nav]").forEach(b=>b.addEventListener("click",open));
document.getElementById("nvclose").onclick=close;
if(location.hash==="#progress")open();
})();
</script>
<script>
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
